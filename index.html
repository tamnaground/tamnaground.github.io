<style>
  :root{
    --orange:#E8630A; --orange-deep:#C24F03; --orange-soft:#FFE3CC;
    --green:#2E7D32; --green-soft:#DCEFDD;
    --blue:#0047AB; --blue-soft:#DCE6F7;
    --ink:#231A12; --ink-2:#5C4E40; --ink-3:#8E8071;
    --bg:#FFF4EA; --bg-2:#FFE9D6; --surface:#FFFFFF;
    --line:rgba(35,26,18,.10); --line-strong:rgba(35,26,18,.18);
    --radius:22px; --radius-sm:14px; --maxw:440px;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    --shadow:0 10px 30px -12px rgba(120,60,10,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:var(--font);color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(90% 60% at 50% -12%, #FFD6B3 0%, rgba(255,214,179,0) 70%),
      radial-gradient(60% 40% at 100% 20%, rgba(255,228,200,.8) 0%, rgba(255,228,200,0) 70%);
    background-attachment:fixed;
    min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:0 0 calc(48px + env(safe-area-inset-bottom));
  }
  a{color:inherit}
  button{font:inherit;color:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:28px 18px 0}

  /* ---------- profile ---------- */
  .profile{text-align:center;padding:14px 0 6px}
  .avatar{
    width:92px;height:92px;border-radius:50%;margin:0 auto 14px;
    background:linear-gradient(145deg,#FF9C4A 0%,var(--orange) 55%,var(--orange-deep) 100%);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:38px;letter-spacing:-.02em;
    box-shadow:0 8px 24px -8px rgba(232,99,10,.6), inset 0 0 0 4px rgba(255,255,255,.55);
  }
  .name{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .handle{margin:2px 0 10px;color:var(--ink-3);font-size:14px}
  .handle a{text-decoration:none}
  .tagline{margin:0 auto;max-width:320px;color:var(--ink-2);font-size:15px;word-break:keep-all}
  .place{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--green);background:var(--green-soft);padding:6px 12px;border-radius:999px;font-weight:600}

  /* ---------- quick links ---------- */
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 8px}
  .quick a{
    display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 8px;font-size:12.5px;font-weight:600;color:var(--ink-2);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .quick a:active{transform:scale(.97)}
  .quick svg{width:22px;height:22px}

  /* ---------- sections ---------- */
  .sec{margin-top:30px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
  .sec-h h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .sec-h span{font-size:12.5px;color:var(--ink-3)}

  /* ---------- program cards ---------- */
  .cards{display:flex;flex-direction:column;gap:16px}
  .card{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .card-media{position:relative;height:150px;background:var(--bg-2)}
  .card-media img{width:100%;height:100%;object-fit:cover;display:block}
  .card-media.grad{display:grid;place-items:center;overflow:hidden}
  .card-media.grad .big{font-size:64px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18))}
  .card-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.35) 100%)}
  .badge{
    position:absolute;top:12px;left:12px;z-index:1;
    font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:5px 10px;border-radius:999px;
    background:rgba(255,255,255,.92);color:var(--ink);backdrop-filter:blur(6px);
  }
  .badge.open{background:var(--orange);color:#fff}
  .badge.open::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .badge.open.g{background:var(--green)}
  .badge.soon{background:rgba(255,255,255,.92);color:var(--ink-2)}
  .badge.inquiry{background:var(--blue);color:#fff}
  .tag{position:absolute;right:12px;bottom:10px;z-index:1;color:#fff;font-size:12.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .card-body{padding:16px 18px 18px}
  .card-body h3{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.02em;word-break:keep-all}
  .card-body .sub{margin:0 0 12px;color:var(--ink-2);font-size:14px;word-break:keep-all}
  .meta{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:5px}
  .meta li{display:flex;gap:8px;font-size:13.5px;color:var(--ink-2)}
  .meta li .i{flex:0 0 18px;text-align:center}
  .btn{
    width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.985);filter:brightness(.95)}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 8px 18px -8px rgba(232,99,10,.7)}
  .btn-green{background:var(--green);color:#fff;box-shadow:0 8px 18px -8px rgba(46,125,50,.6)}
  .btn-blue{background:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(0,71,171,.55)}
  .btn-ghost{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink-2)}
  .note{margin:10px 0 0;font-size:12px;color:var(--ink-3);text-align:center}

  /* 10월 예정 카드 */
  .card.soon{box-shadow:none;background:rgba(255,255,255,.65)}
  .card.soon .card-media{height:112px}
  .card.soon .card-media.grad .big{font-size:48px}
  .soon-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);background:var(--bg);border-radius:12px;padding:10px 12px}

  /* ---------- footer ---------- */
  .foot{margin-top:40px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.7}
  .foot a{color:var(--ink-2)}

  /* ---------- bottom sheet ---------- */
  .overlay{position:fixed;inset:0;background:rgba(35,26,18,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:50}
  .overlay.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    max-width:var(--maxw);margin:0 auto;background:var(--surface);
    border-radius:24px 24px 0 0;max-height:92dvh;overflow:auto;
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.18);
  }
  .sheet.on{transform:translateY(0)}
  .grip{width:40px;height:5px;border-radius:5px;background:var(--line-strong);margin:4px auto 14px}
  .sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
  .sheet-h h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .sheet-h p{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
  .x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
  form{margin-top:12px}
  .f{margin-bottom:14px}
  .f label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
  .f label .req{color:var(--orange);margin-left:2px}
  .f input,.f select,.f textarea{
    width:100%;border:1.5px solid var(--line-strong);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;
    background:#FFFDFB;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
  .f textarea{min-height:84px;resize:vertical}
  .f .help{font-size:12px;color:var(--ink-3);margin-top:5px}
  .seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
  .seg label{position:relative;margin:0;cursor:pointer}
  .seg input{position:absolute;opacity:0;width:0;height:0}
  .seg span{display:block;text-align:center;border:1.5px solid var(--line-strong);border-radius:12px;padding:11px 8px;font-size:14px;font-weight:600;color:var(--ink-2);background:#FFFDFB;word-break:keep-all}
  .seg input:checked + span{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-deep)}
  .seg input:focus-visible + span{box-shadow:0 0 0 3px var(--orange-soft)}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
  .agree{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);margin:4px 0 16px}
  .agree input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--orange);flex:0 0 auto}
  .submit-row{display:flex;flex-direction:column;gap:8px}
  .btn[disabled]{opacity:.6;cursor:progress}
  .done{text-align:center;padding:26px 6px 10px}
  .done .ico{width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 14px;font-size:30px}
  .done h3{margin:0 0 6px;font-size:20px}
  .done p{margin:0 0 18px;color:var(--ink-2);font-size:14px;word-break:keep-all}
  .err{background:#FDECEC;color:#9B1C1C;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
  .err.on{display:block}
  .consent{font-size:12px;color:var(--ink-3);line-height:1.5;margin:0 0 8px;word-break:keep-all;display:block;font-weight:500}
  .pay{background:var(--bg);border-radius:14px;padding:12px 14px;margin:10px 0 4px}
  .pay-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2);padding:3px 0}
  .pay-row b{color:var(--ink);text-align:right}
  .copy{margin-top:8px;border:1.5px solid var(--line-strong);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;width:100%}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* =========================================================
   접수 설정 — 프로그램별 Google Forms 직접 연결
   (formResponse 주소 + 질문별 entry ID. README 참고)
   ========================================================= */
const GFORM_ENTRY = {   // 세 폼 모두 같은 질문 구성(사본)이라 entry ID가 동일
  name: "entry.1324470836", phone: "entry.1981181365", date: "entry.2040371820",

  privacy: "entry.454222183", portrait: "entry.566435667", refund: "entry.882807117",
};
const GFORMS = {
  "biyang-prince":   { action: "https://docs.google.com/forms/d/e/1FAIpQLScn8il26QrOc5Tte3xHoFblGZ6QlS5RrD13FbXgmO2_o2MDpQ/formResponse", entry: GFORM_ENTRY },
  "gyorae-hajungdo": { action: "https://docs.google.com/forms/d/e/1FAIpQLSfl2RUllEaakakIANLtWAKWa-1fqSWRUW6SJ7XTf3Vf9NW15A/formResponse", entry: GFORM_ENTRY },   // forms.gle/ojcKxmz8FVAi8E4U6
  "seongeup-escape": { action: "https://docs.google.com/forms/d/e/1FAIpQLSfW37w64Gk2EEifk0AZM8xfgrt5GIGl5UXUcsxNRNpBSU079w/formResponse", entry: GFORM_ENTRY },   // forms.gle/7RqBEnsTMoTEEkCF9
};
const BANK = "농협 352-2232-4044-73 (ㄱㅇㅈ)";

// 공통 신청 항목 (구글폼과 동일) — dateOpts(선택지)와 dateLabel만 프로그램별로 다름
const applyFields = (dateOpts, dateLabel = "희망 날짜") => [
  { k:"name",  label:"이름", type:"text", req:true, ph:"홍길동", autocomplete:"name" },
  { k:"phone", label:"연락처", type:"tel", req:true, ph:"010-0000-0000", help:"신청 확인 및 안내 연락에 사용돼요" },
  ...(dateOpts.length > 1 ? [{ k:"date", label:dateLabel, type:"seg", req:true, opts:dateOpts }] : []),
  { k:"payer", label:"입금자명", type:"text", req:true, ph:"입금하실 분 성함", help:"신청자명과 다를 경우 꼭 입금자명을 적어주세요 (입금 확인용)" },
  { k:"payStatus", label:"입금 예정", type:"seg", req:true, opts:["입금 완료","금일 중 입금 예정","1-2일 후 입금 예정"] },
  { k:"source", label:"어떻게 알게 되셨나요?", type:"seg", req:true, opts:["인스타그램 광고","인스타그램 게시물/릴스","지인 추천","기타"] },
  { k:"privacy", type:"check", req:true, value:"동의합니다", label:"개인정보 수집·이용 동의 (필수)",
    text:"수집 항목: 성함, 연락처, 입금자명 · 목적: 신청·입금 확인, 행사 안내 · 보유 기간: 행사 종료 후 3개월, 이후 파기. 거부 시 신청 접수가 어려워요." },
  { k:"portrait", type:"seg", req:true, label:"초상권 및 콘텐츠 활용 동의",
    text:"행사 중 촬영된 사진·영상에 본인의 모습이 포함될 수 있으며, 탐라그라운드 홍보(인스타그램·유튜브·블로그, 온라인 광고, 홍보물)에 무상으로 활용됩니다. 철회 요청 시까지.",
    opts:[ {v:"동의합니다 (쵤영 및 홍보 활용에 동의)", l:"동의합니다"}, {v:"동의하지 않습니다(촬영시 홍보에서 제외요청)", l:"홍보에서 제외해 주세요"} ] },
  { k:"refund", type:"check", req:true, value:"위 환불 규정에 동의합니다.", label:"환불 규정 동의 (필수)",
    text:"행사 4일 전까지 취소: 전액 환불 · 행사 3일 전 ~ 당일 취소: 환불 불가 · 천재지변·주최측 사정으로 취소 시: 전액 환불" },

/* =========================================================
   프로그램 목록 — 여기만 고치면 됩니다
   status: open(신청 접수) / soon(예정, 폼 없음) / inquiry(문의)
   ========================================================= */
const PROGRAMS = [

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const backendOf = p => (GFORMS[p.id] && GFORMS[p.id].action) ? GFORMS[p.id] : null;

function cardHTML(p){
  const media = p.image
    ? `<img src="${p.image}" alt="" loading="lazy" ${p.pos ? `style="object-position:${p.pos}"` : ""}>`
    : `<div class="big" aria-hidden="true">${p.emoji || "🍊"}</div>`;
  const badgeCls = p.status === "open" ? `open ${p.theme === "green" ? "g" : ""}` : p.status;
  const foot = p.status === "soon"
    ? `<div class="soon-note">🔔 신청 오픈 시 <a href="https://www.instagram.com/tamnaground/" target="_blank" rel="noopener" style="font-weight:700;color:var(--ink-2)">@tamnaground</a>에서 가장 먼저 안내해요</div>`
    : p.link
      ? `<a class="btn ${p.btn}" style="text-decoration:none" href="${p.link}" target="_blank" rel="noopener">${esc(p.cta)} →</a>`
      : `<button class="btn ${p.btn}" data-open="${p.id}">${esc(p.cta)} →</button>`;
  return `
    <article class="card ${p.status}" id="card-${p.id}">
      <div class="card-media ${p.image ? "" : "grad"}" ${p.grad ? `style="background:${p.grad}"` : ""}>
        ${media}
        <span class="badge ${badgeCls}">${esc(p.badge)}</span>
        <span class="tag">${esc(p.tag)}</span>
      </div>
      <div class="card-body">
        <h3>${esc(p.title)}</h3>
        <p class="sub">${esc(p.sub)}</p>
        <ul class="meta">${p.meta.map(([i,t]) => `<li><span class="i">${i}</span><span>${esc(t)}</span></li>`).join("")}</ul>
        ${foot}
      </div>
    </article>`;
}

function renderCards(){
  for (const [st, sel] of [["open","#cards-open"],["soon","#cards-soon"],["inquiry","#cards-inquiry"]]){
    const list = PROGRAMS.filter(p => p.status === st);
    const box = $(sel); box.innerHTML = list.map(cardHTML).join("");
    box.closest(".sec").style.display = list.length ? "" : "none";
  }
}

function fieldHTML(f){
  const req = f.req ? `<span class="req">*</span>` : "";
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : "";
  const text = f.text ? `<div class="consent">${esc(f.text)}</div>` : "";
  if (f.type === "seg"){
    return `<div class="f"><label>${esc(f.label)}${req}</label>${text}<div class="seg">
      ${f.opts.map(o => { const v = o.v ?? o, l = o.l ?? o; return `<label><input type="radio" name="${f.k}" value="${esc(v)}"><span>${esc(l)}</span></label>`; }).join("")}
    </div>${help}</div>`;
  }
  if (f.type === "check"){
    return `<div class="f"><label class="agree" style="margin:0"><input type="checkbox" name="${f.k}" value="${esc(f.value)}"><span><b>${esc(f.label)}</b>${f.text ? `<span class="consent" style="margin-top:4px">${esc(f.text)}</span>` : ""}</span></label></div>`;
  }
  if (f.type === "textarea"){
    return `<div class="f"><label for="f-${f.k}">${esc(f.label)}${req}</label><textarea id="f-${f.k}" name="${f.k}" placeholder="${esc(f.ph||"")}"></textarea>${help}</div>`;
  }
  const extra = f.type === "tel" ? `inputmode="tel" autocomplete="tel"` : f.autocomplete ? `autocomplete="${f.autocomplete}"` : "";
  return `<div class="f"><label for="f-${f.k}">${esc(f.label)}${req}</label><input id="f-${f.k}" type="${f.type}" name="${f.k}" placeholder="${esc(f.ph||"")}" ${extra}>${help}</div>`;
}

function contactHTML(p, intro){
  const mail = `mailto:hepyhae@naver.com?subject=${encodeURIComponent(`[${p.title}] 신청/문의`)}`;
  return `
    <p style="font-size:14px;color:var(--ink-2);margin:10px 0 16px;word-break:keep-all">${intro}</p>
    <div class="submit-row">
      <a class="btn btn-primary" style="text-decoration:none" href="https://ig.me/m/tamnaground" target="_blank" rel="noopener">인스타 DM으로 보내기</a>
      <a class="btn btn-ghost" style="text-decoration:none" href="tel:010-4023-8081">전화하기</a>
      <a class="btn btn-ghost" style="text-decoration:none" href="${mail}">이메일로 보내기</a>
    </div>`;
}

function openSheet(id){
  const p = PROGRAMS.find(x => x.id === id); if (!p) return;
  const c = $("#sheet-content");
  const head = (sub) => `<div class="sheet-h"><div><h3 id="sheet-title">${esc(p.title)}</h3><p>${sub}</p></div><button class="x" data-close aria-label="닫기">✕</button></div>`;

  if (p.contact || !p.fields){
    c.innerHTML = head("확인 후 연락드립니다") + contactHTML(p, "학교·단체명, 담당자, 연락처, 문의 내용(구매 수량 / 수업 희망 시기)을 남겨주시면 견적서와 소개서를 보내드려요.");
  } else if (!backendOf(p)){
    c.innerHTML = head("신청 접수 준비 중") + contactHTML(p, "이 프로그램의 신청서가 곧 열려요. 지금 신청하시려면 이름·연락처·희망 날짜·인원을 DM으로 보내주세요.");
  } else {
    c.innerHTML = head("선착순 접수 · 입금 후 신청 완료") + `
      <div class="pay">
        <div class="pay-row"><span>참가비</span><b>${esc(p.price || "")}</b></div>
        <div class="pay-row"><span>입금 계좌</span><b>${esc(BANK)}</b></div>
        <button type="button" class="copy" data-copy="${esc(BANK.replace(/[^0-9-]/g,""))}">계좌번호 복사</button>
        <div class="help" style="margin-top:6px">입금자명을 신청자명과 동일하게 해주세요. 입금 후 신청이 완료됩니다.</div>
      </div>
      <form id="form" novalidate>
        <div class="err" id="err"></div>
        ${p.fields.map(fieldHTML).join("")}
        <div class="hp" aria-hidden="true"><label>회사명<input type="text" name="company" tabindex="-1" autocomplete="off"></label></div>
        <div class="submit-row">
          <button type="submit" class="btn ${p.btn}" id="submit">신청 완료하기</button>
          <button type="button" class="btn btn-ghost" data-close>닫기</button>
        </div>
      </form>`;
    $("#form").addEventListener("submit", e => submit(e, p));
  }

  $("#overlay").classList.add("on"); $("#sheet").classList.add("on");
  document.body.style.overflow = "hidden";
  $("#sheet").scrollTop = 0;
  setTimeout(() => { const first = $("#sheet input:not([type=radio]):not([type=checkbox])"); first && first.focus({preventScroll:true}); }, 320);
}

function closeSheet(){
  $("#overlay").classList.remove("on"); $("#sheet").classList.remove("on");
  document.body.style.overflow = "";
}

async function submit(e, p){
  e.preventDefault();
  const form = e.target, err = $("#err");
  err.classList.remove("on");
  const fail = (msg) => { err.textContent = msg; err.classList.add("on"); err.scrollIntoView({behavior:"smooth",block:"center"}); };

  const data = Object.assign({}, p.fixed || {});
  for (const f of p.fields){
    let v = "";
    if (f.type === "seg") v = form.querySelector(`input[name="${f.k}"]:checked`)?.value || "";
    else if (f.type === "check") v = form.elements[f.k].checked ? f.value : "";
    else v = (form.elements[f.k]?.value || "").trim();
    if (f.req && !v) return fail(f.type === "check" ? `${f.label}에 체크해 주세요.` : `${f.label}을(를) 입력해 주세요.`);
    data[f.k] = v;
  }
  const d = data.phone.replace(/\D/g, "");
  if (!(/^0\d{8,10}$/.test(d) && !(d.startsWith("010") && d.length !== 11))) return fail("연락처 형식을 확인해 주세요. (예: 010-1234-5678)");
  if (form.elements.company.value){ showDone(p); return; } // 봇 — 조용히 무시

  const btn = $("#submit"); btn.disabled = true; btn.textContent = "보내는 중…";
  try {
    const g = backendOf(p);
    const fd = new URLSearchParams();
    for (const [k, id] of Object.entries(g.entry)) if (data[k]) fd.append(id, data[k]);
    fd.append("fvv", "1"); fd.append("pageHistory", "0");
    await fetch(g.action, { method:"POST", mode:"no-cors", body: fd });   // Google Forms는 응답을 읽을 수 없음(opaque) — 도달하면 접수됨
    showDone(p);
  } catch (ex) {
    btn.disabled = false; btn.textContent = "다시 시도";
    err.innerHTML = `전송에 실패했어요. 잠시 후 다시 시도하거나 <a href="https://ig.me/m/tamnaground" target="_blank" rel="noopener">인스타 DM</a>으로 보내주세요.`;
    err.classList.add("on");
  }
}

function showDone(p){
  $("#sheet-content").innerHTML = `
    <div class="done">
      <div class="ico">✓</div>
      <h3>신청이 접수됐어요!</h3>
      <p>${esc(p.doneMsg)}</p>
      <div class="pay" style="text-align:left">
        <div class="pay-row"><span>참가비</span><b>${esc(p.price || "")}</b></div>
        <div class="pay-row"><span>입금 계좌</span><b>${esc(BANK)}</b></div>
        <button type="button" class="copy" data-copy="${esc(BANK.replace(/[^0-9-]/g,""))}">계좌번호 복사</button>
      </div>
      <div class="submit-row" style="margin-top:14px">
        <a class="btn btn-primary" style="text-decoration:none" href="https://www.instagram.com/tamnaground/" target="_blank" rel="noopener">인스타에서 소식 받기</a>
        <button type="button" class="btn btn-ghost" data-close>닫기</button>
      </div>
    </div>`;
  $("#sheet").scrollTop = 0;
}

document.addEventListener("click", async e => {
  const o = e.target.closest("[data-open]"); if (o){ openSheet(o.dataset.open); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp){ try { await navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = "복사됐어요 ✓"; setTimeout(() => cp.textContent = "계좌번호 복사", 1800); } catch(_){} return; }
  if (e.target.closest("[data-close]") || e.target === $("#overlay")) closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

renderCards();
// ?p=biyang-prince 처럼 링크로 특정 프로그램 폼을 바로 열 수 있어요 (카드뉴스 CTA용)

const qpP = PROGRAMS.find(x => x.id === qp && x.status !== "soon");
if (qpP) { if (qpP.link) location.replace(qpP.link); else setTimeout(() => openSheet(qp), 250); }
